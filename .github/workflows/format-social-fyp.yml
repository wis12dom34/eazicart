name: Format social FYP

on:
  push:
    branches:
      - figma/apple-minimal-social-fyp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: figma/apple-minimal-social-fyp
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore normal Prettier scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.prettierignore')
          blocked = {
              '# Figma social feed is maintained as an isolated generated-style UI module.',
              'apps/web/app/home-social-feed.tsx',
              'apps/web/app/home-social-feed.css',
          }
          lines = [line for line in path.read_text().splitlines() if line not in blocked]
          path.write_text('\n'.join(lines).rstrip() + '\n')
          PY
      - name: Format FYP files
        run: pnpm exec prettier --write apps/web/app/home-content.tsx apps/web/app/home-social-feed.tsx apps/web/app/home-social-feed.css .prettierignore
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/home-content.tsx apps/web/app/home-social-feed.tsx apps/web/app/home-social-feed.css .prettierignore
          git commit -m 'style: format Apple-minimal social FYP'
          git push origin HEAD:figma/apple-minimal-social-fyp
