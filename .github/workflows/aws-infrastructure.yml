name: AWS infrastructure validation

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infrastructure.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cfn-lint==1.57.2
      - run: cfn-lint infra/aws/api.yaml infra/aws/database.yaml
