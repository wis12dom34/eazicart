name: Diagnose lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Capture lint output
        shell: bash
        run: |
          set +e
          pnpm lint > lint-output.txt 2>&1
          status=$?
          cat lint-output.txt
          echo "lint_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint output
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
          retention-days: 1
